name: CI

on:
  push:
  pull_request:

env:
  SYMFONY_DEPRECATIONS_HELPER: 'max[direct]=0'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}${{ matrix.deps == 'lowest' && ' / prefer-lowest' || '' }} / ${{ matrix.os || 'ubuntu-latest' }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            symfony: '6.4.*'
            deps: 'lowest'
          - php: '8.2'
            symfony: '6.4.*'
          - php: '8.2'
            symfony: '7.4.*'
          - php: '8.3'
            symfony: '7.4.*'
          - php: '8.4'
            symfony: '8.0.*'
          - php: '8.5'
            symfony: '8.0.*'
          - php: '8.5'
            symfony: 'latest'
          - php: '8.5'
            symfony: 'latest'
            os: windows-latest
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP
        # v2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:2.10.3

      - name: Cache Composer packages
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ matrix.symfony }}-${{ matrix.deps || 'latest' }}-${{ hashFiles('composer.json', 'composer.lock') }}

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Constrain Symfony runtime packages
        if: matrix.symfony != 'latest'
        run: >
          composer require --no-update --no-interaction
          "symfony/config:${{ matrix.symfony }}"
          "symfony/dependency-injection:${{ matrix.symfony }}"
          "symfony/framework-bundle:${{ matrix.symfony }}"
          "symfony/http-foundation:${{ matrix.symfony }}"
          "symfony/http-kernel:${{ matrix.symfony }}"
          "symfony/routing:${{ matrix.symfony }}"
          "symfony/twig-bundle:${{ matrix.symfony }}"

      - name: Constrain Symfony development packages
        if: matrix.symfony != 'latest'
        run: >
          composer require --dev --no-update --no-interaction
          "symfony/browser-kit:${{ matrix.symfony }}"
          "symfony/phpunit-bridge:${{ matrix.symfony }}"
          "symfony/security-bundle:${{ matrix.symfony }}"
          "symfony/security-core:${{ matrix.symfony }}"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress ${{ matrix.deps == 'lowest' && '--prefer-lowest' || '' }}

      - name: PHPUnit
        run: vendor/bin/phpunit

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: PHP-CS-Fixer (dry run)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: No-dev smoke test
        run: |
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          cp -a . "$smoke_dir/app"
          rm -rf "$smoke_dir/app/vendor" "$smoke_dir/app/.phpunit.cache" "$smoke_dir/app/.php-cs-fixer.cache"
          (
            cd "$smoke_dir/app"
            composer install --no-dev --no-interaction --prefer-dist --no-progress
            php tests/Smoke/no-dev.php
          )

  installation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - php: '8.2'
            symfony: '^6.4'
          - php: '8.4'
            symfony: '^8.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: bash tests/Smoke/install.sh
        env:
          SYMFONY_SKELETON_VERSION: ${{ matrix.symfony }}

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
