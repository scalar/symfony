name: Code quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        # v7.0.1
        uses: actions/checkout@v7.0.1
      - name: Setup PHP
        # v2.40.0
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.4'
          coverage: xdebug
          tools: composer:2.10.3, infection:0.35.12@sha256:b7e9a28e23daf8178c80bb768bc3fd12047e92ef16ea5724af432314a4c01964
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Mutation testing
        run: composer test-mutation

  scalar-configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run generate:configuration
      - name: Verify generated configuration
        run: |
          git ls-files --error-unmatch -- docs/configuration.yaml
          git diff --exit-code -- docs/configuration.yaml
